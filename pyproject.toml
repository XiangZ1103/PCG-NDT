[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcg-ndt"
version = "1.0.0"
description = "Physics-Concept-Guided Neural Decision Tree for radar jamming recognition"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4", "scipy==1.13.1", "torch==2.2.2"]

[tool.setuptools.packages.find]
include = ["pcg_ndt*"]

[tool.black]
line-length = 88
